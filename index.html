<body>
  <header class="site-header">
    <a class="brand" href="#" aria-label="和你的小约定，返回邀请页" id="brand-home">
      <span class="brand-icon"><svg viewBox="0 0 40 36" width="39" height="36" fill="none" aria-hidden="true"><rect x="3" y="8" width="34" height="24" rx="4" fill="#edcee7" stroke="#35342f" stroke-width="1.5"/><path d="m4 10 16 12 16-12M4 30l11-11m21 11L25 19" stroke="#35342f" stroke-width="1.4" stroke-linejoin="round"/><path d="M20 13c-6-3-5-8-2-8 1.5 0 2 1.5 2 1.5S21 5 22.5 5c3.5 0 3.5 5-2.5 8Z" fill="#fffdf8" stroke="#35342f" stroke-width="1.2"/></svg></span>

    <svg class="doodle flower two" viewBox="0 0 40 40" fill="none" aria-hidden="true"><path d="M20 15C3-2 0 23 14 21-2 37 25 43 23 27c13 18 25-8 9-9 12-15-12-24-12-3Z" fill="currentColor"/><circle cx="21" cy="21" r="5" fill="#f8f5ee"/></svg>
    <span class="doodle sparkle one" aria-hidden="true">✧</span><span class="doodle sparkle two" aria-hidden="true">✦</span>

  <script>
    'use strict';
    const $ = (selector, root = document) => root.querySelector(selector);
    const escapeHTML = value => String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const pad = n => String(n).padStart(2, '0');
    function dateValue(date) { return `${date.getFullYear()}-${pad(date.getMonth()+1)}-${pad(date.getDate())}`; }
    function dayAfter(offset) { const d = new Date(); d.setDate(d.getDate()+offset); return dateValue(d); }
    function parseDate(value) { const parts=value.split('-').map(Number); return new Date(parts[0],parts[1]-1,parts[2]); }
    function niceDate(value) { const d=parseDate(value);return `${d.getMonth()+1}月${d.getDate()}日`; }

    function syncQuickDates(){const saturday=weekend();document.querySelectorAll('[data-quick]').forEach(b=>{const val=b.dataset.quick==='today'?dayAfter(0):b.dataset.quick==='tomorrow'?dayAfter(1):saturday;b.classList.toggle('selected',state.date===val);});}
    function weekend(){const d=new Date();const day=d.getDay();d.setDate(d.getDate()+(day===0?0:6-day));return dateValue(d);}
    function validateDate(){
      state.date=$('#date-input').value;state.time=$('#time-input').value;
      const when=new Date(`${state.date}T${state.time}`);
      if(!state.date||!state.time||!Number.isFinite(when.getTime())){$('#date-error').textContent='先选好日期和时间，再一起期待吧。';return false;}
      if(when.getTime()<=Date.now()){$('#date-error').textContent='这个时间已经过去啦，选一个还来得及见面的时间吧。';return false;}
      return true;
    }
    let dodgeLockedUntil=0;
    function dodge(event){
      const button=$('#no-button');if(!button||state.step!==0)return;
      const now=performance.now();
      if(event?.type==='pointerenter'&&now<dodgeLockedUntil)return;
      dodgeLockedUntil=now+220;
      const area=button.parentElement, bounds=area.getBoundingClientRect();
      const yes=$('[data-action="yes"]').getBoundingClientRect();
      const current=button.getBoundingClientRect();
      const w=button.offsetWidth,h=button.offsetHeight;
      const minX=Math.max(4,8-bounds.left),maxX=Math.min(area.clientWidth-w-4,innerWidth-bounds.left-w-8);
      const minY=Math.max(0,8-bounds.top),maxY=Math.min(area.clientHeight-h-4,innerHeight-bounds.top-h-8);
      const candidates=[];
      if(maxX>=minX&&maxY>=minY){
        for(const x of [minX,(minX+maxX)/2,maxX])for(const y of [minY,(minY+maxY)/2,maxY]){
          const left=bounds.left+x,top=bounds.top+y;
          const overlapsYes=left<yes.right+12&&left+w>yes.left-12&&top<yes.bottom+12&&top+h>yes.top-12;
          const underPointer=event&&(event.type==='pointerenter'||event.detail!==0)&&Number.isFinite(event.clientX)&&event.clientX>left-14&&event.clientX<left+w+14&&event.clientY>top-14&&event.clientY<top+h+14;
          const distance=Math.hypot(left-current.left,top-current.top);
          if(!overlapsYes&&!underPointer&&distance>32)candidates.push({x,y,distance});
        }
      }
      if(candidates.length){
        candidates.sort((a,b)=>b.distance-a.distance);
        const target=candidates[Math.floor(Math.random()*Math.min(2,candidates.length))];
        button.style.transform=`translate(${target.x-button.offsetLeft}px,${target.y-button.offsetTop}px)`;
      }
      state.dodges++;
      const responses=['诶，点不到','我溜～','再追一下？','差一点点','略略略～','抓不到我吧'];
      button.textContent=responses[(state.dodges-1)%responses.length];
      $('#chase-note').textContent=`已经溜走 ${state.dodges} 次，小狗也在偷笑 ♡`;
    }
    window.addEventListener('resize',()=>{const button=$('#no-button');if(button)button.style.transform='';});
    scene.addEventListener('click',async e=>{
      const food=e.target.closest('[data-food]');
      if(food){state.food=food.dataset.food;document.querySelectorAll('[data-food]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.food===state.food)));$('.food-other-input').hidden=state.food!=='other';$('[data-action="finish"]').disabled=false;if(state.food==='other')$('#other-food').focus();return;}
      const quick=e.target.closest('[data-quick]');if(quick){state.date=quick.dataset.quick==='today'?dayAfter(0):quick.dataset.quick==='tomorrow'?dayAfter(1):weekend();$('#date-input').value=state.date;syncQuickDates();$('#date-error').textContent='';return;}
      const action=e.target.closest('[data-action]')?.dataset.action;if(!action)return;
      switch(action){
        case 'yes':state.step=1;render(true);confetti(15);break;
        case 'next':state.step++;render(true);break;
        case 'back':state.step=Math.max(0,state.step-1);state.dodges=0;render(true);break;
        case 'no':dodge(e);break;
        case 'finish':if(state.food){state.step=4;render(true);confetti(34);}break;
        case 'edit':state.step=2;render(true);break;
        case 'copy':await copyPlan();break;
        case 'save':await saveCard();break;
      }
    });
    $('#brand-home').addEventListener('click',e=>{e.preventDefault();state.step=0;state.dodges=0;render(true);});
    $('#customize').addEventListener('click',()=>{$('#from-name').value=settings.from;$('#to-name').value=settings.to;$('#invite-note').value=settings.note;$('#settings-dialog').showModal();});
    document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',()=>document.getElementById(b.dataset.close).close()));
    document.querySelectorAll('dialog').forEach(dialog=>dialog.addEventListener('click',e=>{if(e.target===dialog){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dialog.close();}}));
    $('#settings-form').addEventListener('submit',e=>{e.preventDefault();settings={from:$('#from-name').value.trim().slice(0,12),to:$('#to-name').value.trim().slice(0,12),note:$('#invite-note').value.trim().slice(0,48)};let saved=true;try{localStorage.setItem('little-date-settings-v1',JSON.stringify(settings));}catch{saved=false;}$('#settings-dialog').close();state.dodges=0;render();toast(saved?'你的心意，已经写进去了 ♡':'心意已更新；当前浏览器无法保存设置。');});
    let toastTimer;
    function toast(message){clearTimeout(toastTimer);$('#toast').textContent=message;$('#toast').classList.add('show');toastTimer=setTimeout(()=>$('#toast').classList.remove('show'),3200);}
    function confetti(count){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;for(let i=0;i<count;i++){const item=document.createElement('div');item.className='confetti';item.style.left=`${Math.random()*100}%`;item.style.setProperty('--duration',`${2.6+Math.random()*1.8}s`);item.style.setProperty('--spin',`${Math.random()*220-110}deg`);item.style.setProperty('--size',`${9+Math.random()*9}px`);item.style.setProperty('--color',['#d4a0c3','#bca8ce','#d8c19d','#ddadae'][i%4]);item.style.animationDelay=`${Math.random()*.5}s`;item.innerHTML=`<span>${i%3===0?'♡':i%3===1?'✦':'·'}</span>`;document.body.append(item);setTimeout(()=>item.remove(),5100);}}
